[pytest]
asyncio_mode = auto
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vv --show-capture=all
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
norecursedirs = app
