stages:
  - quality
  - build
  - deploy

variables:
  NODE_VERSION: '22'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# STAGE: QUALITY
lint:
  stage: quality
  image: node:22
  tags:
    - deploy
  before_script:
    - corepack enable
    - npm ci
  script:
    - npm run lint
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'

prettier:
  stage: quality
  image: node:22
  tags:
    - deploy
  before_script:
    - corepack enable
    - npm ci
  script:
    - npm run format:check
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'

typecheck:
  stage: quality
  image: node:22
  tags:
    - deploy
  before_script:
    - corepack enable
    - npm ci
  script:
    - npx tsc -p tsconfig.json --noEmit
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'

# STAGE: BUILD
build_check:
  stage: build
  image: node:22
  tags:
    - deploy
  before_script:
    - corepack enable
    - npm ci
  script:
    - echo "🔨 Verificando build..."
    - npm run build
    - echo "✅ Build passou!"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# STAGE: DEPLOY - PREVIEW
deploy_preview:
  stage: deploy
  image: node:22-alpine
  tags:
    - deploy
  before_script:
    - npm install -g vercel@latest
  script:
    - echo "🚀 Deploy Preview na Vercel"
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
    - vercel build --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID > deployment-url.txt
    - echo "✅ Deploy de preview concluído!"
    - cat deployment-url.txt
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: on_success

# STAGE: DEPLOY - PRODUCTION
deploy_production:
  stage: deploy
  image: node:22-alpine
  tags:
    - deploy
  before_script:
    - npm install -g vercel@latest
  script:
    - echo "🚀 Deploy Production na Vercel"
    - echo "Project ID:" $VERCEL_PROJECT_ID
    - echo "Org ID:" $VERCEL_ORG_ID
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
    - vercel build --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID > deployment-url.txt
    - echo "✅ Deploy concluído!"
    - cat deployment-url.txt
  environment:
    name: production
    url: https://bah-frontend.vercel.app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success
