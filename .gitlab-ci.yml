stages:
  - validate
  - quality
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE_PROD: docker-compose.prod.yml
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

.python_job:
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install pipenv
    - pipenv install --dev

validate_branch:
  stage: validate
  image: alpine:latest
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" =~ ^(main|dev|feature/.*|hotfix/.*|release/.*)$ ]]; then
        echo "✅ Branch válido: $CI_COMMIT_REF_NAME"
      else
        echo "❌ Branch inválido: $CI_COMMIT_REF_NAME"
        exit 1
      fi
  except:
    - main
    - dev

lint:
  extends: .python_job
  stage: quality
  script:
    - echo "🔍 Verificando formatação..."
    - pipenv run format:all
    - pipenv run lint:all
    - pipenv run pylint:all
  only:
    - merge_requests
    - main
    - dev

test:
  extends: .python_job
  stage: test
  script:
    - echo "🧪 Rodando testes..."
    - pipenv run test:cov
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      cobertura: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - dev

build_check:
  stage: build
  tags:
    - deploy
  script:
    - echo "🔨 Building images..."
    - docker-compose build --no-cache
    - docker-compose -f ${COMPOSE_FILE_PROD} build --no-cache
  only:
    - merge_requests
    - main

deploy_production:
  stage: deploy
  tags:
    - deploy
  script:
    - echo "🚀 Iniciando deploy"
    - echo "POSTGRES_DB=${POSTGRES_DB}" > .env.prod
    - echo "POSTGRES_USER=${POSTGRES_USER}" >> .env.prod
    - echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env.prod
    - echo "JWT_SECRET=${JWT_SECRET}" >> .env.prod
    - echo "JWT_TTL=${JWT_TTL}" >> .env.prod
    - echo "JWT_ISS=${JWT_ISS}" >> .env.prod
    - echo "CORS_ORIGINS=${CORS_ORIGINS}" >> .env.prod
    - echo "ENVIRONMENT=production" >> .env.prod
    - echo "✅ .env.prod criado"
    - echo "📦 Parando containers antigos..."
    - docker-compose -f ${COMPOSE_FILE_PROD} --env-file .env.prod down || true
    - echo "🧹 Limpando recursos..."
    - docker system prune -af --filter "until=24h" || true
    - echo "🔨 Building images..."
    - docker-compose -f ${COMPOSE_FILE_PROD} --env-file .env.prod build --no-cache
    - echo "🚢 Subindo containers..."
    - docker-compose -f ${COMPOSE_FILE_PROD} --env-file .env.prod up -d
    - echo "⏳ Aguardando 30s..."
    - sleep 30
    - echo "🔍 Status dos containers:"
    - docker-compose -f ${COMPOSE_FILE_PROD} ps
    - echo "📋 Logs da aplicação:"
    - docker-compose -f ${COMPOSE_FILE_PROD} logs --tail=50 app
    - echo "🔥 Limpando .env.prod"
    - rm -f .env.prod
    - echo "✨ Deploy concluído!"
    - echo "🌐 URL: http://${EC2_PUBLIC_DNS}:8000/docs"
  only:
    - main
  environment:
    name: production
    url: http://$EC2_PUBLIC_DNS:8000
  when: manual

rollback_production:
  stage: deploy
  tags:
    - deploy
  script:
    - echo "🔄 Rollback..."
    - docker-compose -f ${COMPOSE_FILE_PROD} down
    - docker-compose -f ${COMPOSE_FILE_PROD} up -d
  only:
    - main
  when: manual
  environment:
    name: production
    action: rollback
