stages:
  - validate
  - quality
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Variáveis para testes
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

.python_job:
  image: python:3.12-slim
  tags:
    - deploy
  before_script:
    - python --version
    - pip install pipenv
    - pipenv install --dev

validate_branch:
  stage: validate
  image: alpine:latest
  tags:
    - deploy
  script:
    - echo "Validando branch $CI_COMMIT_REF_NAME"
  except:
    - main
    - dev

lint:
  extends: .python_job
  stage: quality
  script:
    - pipenv run format:all
    - pipenv run lint:all
    - pipenv run pylint:all
  only:
    - merge_requests
    - main
    - dev

test:
  extends: .python_job
  stage: test
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  script:
    - pipenv run test:cov
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      cobertura: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - main
    - dev
  allow_failure: true

build_check:
  stage: build
  tags:
    - deploy
  script:
    - docker-compose build
    - docker-compose -f docker-compose.prod.yml build
  only:
    - merge_requests
    - main

deploy_production:
  stage: deploy
  tags:
    - deploy
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  only:
    - main
  environment:
    name: production
    url: http://$EC2_PUBLIC_DNS:8000
  when: manual
