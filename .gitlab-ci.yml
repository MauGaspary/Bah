workflow:
  rules:
    - when: never

image: node:22

cache:
  paths:
    - node_modules/

default:
  before_script:
    - corepack enable
    - npm ci

stages:
  - quality
  - build
  - deploy

lint:
  stage: quality
  script: ['npm run lint']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

prettier:
  stage: quality
  script: ['npm run format:check']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

typecheck:
  stage: quality
  script: ['npx tsc -p tsconfig.json --noEmit']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy_preview:
  stage: deploy
  image: node:22
  before_script:
    - npm install -g vercel@latest
    - corepack enable
    - npm ci
  script:
    - vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --confirm
  environment:
    name: preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

deploy_production:
  stage: deploy
  image: node:22
  before_script:
    - npm install -g vercel@latest
    - corepack enable
    - npm ci
  script:
    - vercel --prod --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --confirm
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
