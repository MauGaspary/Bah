stages:
  - validate
  - quality
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  UMAMI_DATABASE: ostgresql://umami:umami@umami-db:5432/umami
  UMAMI_APP_SECRET: chaveseguradoumamiiiiiiiiii
  UMAMI_DATABASE_NAME: umami
  UMAMI_DATABASE_USER: umami
  UMAMI_DATABASE_PASSWORD: umami

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

.python_job:
  image: python:3.12-slim
  tags:
    - deploy
  before_script:
    - python --version
    - pip install pipenv
    - pipenv install --dev

validate_branch:
  stage: validate
  image: alpine:latest
  tags:
    - deploy
  script:
    - echo "Validando branch $CI_COMMIT_REF_NAME"
  except:
    - main
    - dev
  allow_failure: true

lint:
  extends: .python_job
  stage: quality
  script:
    - pipenv run format:all
    - pipenv run lint:all
    - pipenv run pylint:all
  only:
    - merge_requests
    - main
    - dev
  allow_failure: true

test:
  extends: .python_job
  stage: test
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  script:
    - pipenv run test:cov || true
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      cobertura: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - main
    - dev
  allow_failure: true

build_check:
  stage: build
  image: docker:24-cli
  tags:
    - deploy
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose version
    - docker-compose build || echo "Build dev failed, continuing..."
    - docker-compose -f docker-compose.prod.yml build
  only:
    - merge_requests
    - main
  allow_failure: true

deploy_production:
  stage: deploy
  image: docker:24-cli
  tags:
    - deploy
  before_script:
    - apk add --no-cache docker-compose bash
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  only:
    - main
  environment:
    name: production
    url: http://$EC2_PUBLIC_DNS:8000
  when: manual
  allow_failure: true
