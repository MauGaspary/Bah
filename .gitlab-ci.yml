stages:
  - validate
  - quality
  - test

before_script:
  - python --version
  - pip install pipenv
  - pipenv install --dev

validate_branch:
  stage: validate
  image: alpine:latest
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" =~ ^(main|dev|feature/.*|hotfix/.*|release/.*)$ ]]; then
        echo "Nome da branch válido: $CI_COMMIT_REF_NAME"
      else
        echo "Nome da branch inválido: $CI_COMMIT_REF_NAME"
        echo "Use: feature/*, hotfix/*, release/*, main, dev"
        exit 1
      fi
  except:
    - main
    - dev

lint:
  stage: quality
  image: python:3.12-slim
  script:
    - pipenv run format:all
    - pipenv run lint:all
    - pipenv run pylint:all
  only:
    - merge_requests
    - main
    - dev

test:
  stage: test
  image: python:3.12-slim
  script:
    - pipenv run test:cov
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      cobertura: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - dev
