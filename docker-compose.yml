services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bah_db
      POSTGRES_USER: bah_user
      POSTGRES_PASSWORD: bah_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bah_user -d bah_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://bah_user:bah_password@db:5432/bah_db
    volumes:
      - .:/app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    environment:
      DATABASE_URL: postgresql://bah_user:bah_password@db:5432/bah_db
    volumes:
      - .:/app
    command: python -m app.scripts.seed
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bah_user:bah_password@db:5432/bah_db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      seed:
        condition: service_completed_successfully

  test:
    build: .
    volumes:
      - .:/app
    command: pytest tests -vv --show-capture=all
    profiles: ["tools"]

  test-cov:
    build: .
    volumes:
      - .:/app
    command: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 tests
    profiles: ["tools"]

  quality:
    build: .
    volumes:
      - .:/app
    command: sh -c "black . && isort --profile black . && pylint app && mypy app"
    profiles: ["tools"]

  stack:
    build: .
    environment:
      DATABASE_URL: postgresql://bah_user:bah_password@db:5432/bah_db
    volumes:
      - .:/app
    command: sh -c "echo 'App iniciada' && tail -f /dev/null"
    depends_on:
      - app
    profiles: ["stack"]

volumes:
  postgres_data:
