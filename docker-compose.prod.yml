services:
  db:
    image: pgvector/pgvector:pg15
    container_name: bah_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bah_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bah_migrate_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_ISS: ${JWT_ISS}
      MODEL_DIMENSIONS: ${MODEL_DIMENSIONS:-768}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bah_network

  seed:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bah_seed_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_ISS: ${JWT_ISS}
      MODEL_DIMENSIONS: ${MODEL_DIMENSIONS:-768}
    command: python -m app.scripts.seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - bah_network

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bah_app_prod
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_ISS: ${JWT_ISS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
      MODEL_DIMENSIONS: ${MODEL_DIMENSIONS:-768}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - bah_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  umami-db:
    image: postgres:15
    container_name: umami-db
    environment:
      POSTGRES_DB: ${UMAMI_DATABASE_NAME}
      POSTGRES_USER: ${UMAMI_DATABASE_USER}
      POSTGRES_PASSWORD: ${UMAMI_DATABASE_PASSWORD}
    volumes:
      - umami_data:/var/lib/postgresql/data
    ports:
      - "5000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: umami
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${UMAMI_DATABASE}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  postgres_data_prod:
  umami_data:

networks:
  bah_network:
    driver: bridge
